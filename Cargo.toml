[workspace]
resolver = "2"
members = ["crates/lc-core", "crates/lc-device", "crates/lc-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
async-trait = "0.1"
rand = "0.8"
lc-core = { path = "crates/lc-core" }
lc-device = { path = "crates/lc-device" }
