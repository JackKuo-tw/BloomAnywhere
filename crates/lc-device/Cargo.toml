[package]
name = "lc-device"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Device backends (iOS via idevice, Android via adb, Mock) for location simulation"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
idevice = { version = "0.1.68", features = ["usbmuxd", "location_simulation", "dvt", "core_device_proxy", "tunnel_tcp_stack", "rsd"] }
plist = "1"
